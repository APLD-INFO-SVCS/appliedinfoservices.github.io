<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Page not found | Applied Information Services">
  <meta name="robots" content="noindex, nofollow">
  <title>Page Not Found | Applied Information Services</title>

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="favicon-16.png" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Google Analytics: consent-gated, see js/cookie-consent.js -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css?v=13">

</head>
<body>
  <div id="cookie-banner" class="cookie-banner" hidden>
    <p class="cookie-banner-text">We use cookies for basic site analytics. <a href="privacy-policy.html">Privacy Policy</a></p>
    <div class="cookie-banner-actions">
      <button id="cookie-decline" type="button" class="cookie-banner-btn">Decline</button>
      <button id="cookie-accept" type="button" class="cookie-banner-btn cookie-banner-btn-primary">Accept</button>
    </div>
  </div>

  <div id="header-placeholder"></div>

  <div class="page-content">
    <div class="content-section" style="text-align: center;">
      <h2>404 &middot; Page Not Found</h2>
      <p>The page you're looking for doesn't exist, or it moved.</p>
      <div class="project-buttons" style="justify-content: center;">
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="research.html">Research</a>
        <a href="faq.html">FAQ</a>
      </div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script>
    fetch('includes/header.html')
      .then(response => response.text())
      .then(data => document.getElementById('header-placeholder').innerHTML = data);

    fetch('includes/footer.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('footer-placeholder').innerHTML = data;
        document.querySelectorAll('.ais-copyright-year').forEach(el => {
          el.textContent = new Date().getFullYear();
        });
      });
  </script>

  <script src="js/cookie-consent.js"></script>

</body>
</html>
